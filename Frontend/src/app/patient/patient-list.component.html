<h1>Patients</h1>
<button routerLink="create">Create New Patient</button>
<div *ngFor="let patient of patients" style="border: 1px solid #ccc; margin: 10px; padding: 10px;">
  <p><strong>ID:</strong> {{ patient.id }}</p>
  <p><strong>Name:</strong> {{ patient.name }}</p>
  <p><strong>Age:</strong> {{ patient.age }}</p>
  <p><strong>Email:</strong> {{ patient.email }}</p>
  <p><strong>Phone:</strong> {{ patient.phone }}</p>
  <button (click)="delete(patient.id)">Delete</button>
</div>

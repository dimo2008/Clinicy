<h2>Create Patient</h2>
<form (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="name">Name:</label>
    <input type="text" id="name" [(ngModel)]="patient.name" name="name" required class="form-control">
  </div>
  <div class="form-group">
    <label for="age">Age:</label>
    <input type="number" id="age" [(ngModel)]="patient.age" name="age" required class="form-control">
  </div>
  <button type="submit" class="btn btn-success">Create</button>
</form>
